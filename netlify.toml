[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Explicit 404s for dead git/ZIP mirrors — MUST come before the SPA fallback
[[redirects]]
  from = "/repo.git"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/repo.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/download"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/download/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
